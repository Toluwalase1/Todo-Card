<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <article class="todo-card" data-testid="test-todo-card" aria-labelledby="task-title">
      <header class="card-header">
        <div class="title-wrap">
          <div class="priority-indicator" data-testid="test-todo-priority-indicator" aria-label="Priority indicator"></div>
          <input
            id="task-complete"
            class="complete-toggle"
            type="checkbox"
            data-testid="test-todo-complete-toggle"
            aria-label="Mark task as complete"
          />
          <label for="task-complete" class="sr-only">Mark task as complete</label>
          <div>
            <h2 id="task-title" data-testid="test-todo-title">Ship onboarding flow redesign</h2>
            <div class="status-controls">
              <span class="status" data-testid="test-todo-status" aria-live="polite">In Progress</span>
              <select class="status-control-select" data-testid="test-todo-status-control" aria-label="Change task status">
                <option value="Pending">Pending</option>
                <option value="In Progress" selected>In Progress</option>
                <option value="Done">Done</option>
              </select>
            </div>
          </div>
        </div>

        <div class="actions" aria-label="Task actions">
          <button type="button" class="icon-btn" data-testid="test-todo-edit-button" aria-label="Edit task">Edit</button>
          <button type="button" class="icon-btn danger" data-testid="test-todo-delete-button" aria-label="Delete task">Delete</button>
        </div>
      </header>

      <div class="description-wrapper">
        <p class="description" data-testid="test-todo-description">
          Finalize the welcome checklist, update empty states, and align handoff notes with product and engineering before release.
        </p>
        <button type="button" class="expand-toggle" data-testid="test-todo-expand-toggle" aria-label="Expand description" aria-expanded="false"></button>
      </div>

      <section class="meta-grid" aria-label="Task metadata">
        <div class="meta-item">
          <span class="meta-label">Priority</span>
          <strong class="badge" data-testid="test-todo-priority">High</strong>
        </div>

        <div class="meta-item">
          <span class="meta-label">Due date</span>
          <time id="todo-due-date" data-testid="test-todo-due-date" datetime="2026-04-16T12:00:00"></time>
        </div>

        <div class="meta-item time-remaining-wrapper">
          <span class="meta-label">Time remaining</span>
          <div class="time-display">
            <time id="todo-time-remaining" data-testid="test-todo-time-remaining" datetime="2026-04-16T12:00:00" aria-live="polite"></time>
            <span class="overdue-indicator" data-testid="test-todo-overdue-indicator" aria-live="polite"></span>
          </div>
        </div>
      </section>

      <section class="tag-section" aria-label="Categories">
        <span class="meta-label">Categories</span>
        <ul class="tags" role="list" data-testid="test-todo-tags">
          <li class="tag" data-testid="test-todo-tag-design">Design</li>
          <li class="tag" data-testid="test-todo-tag-product">Product</li>
          <li class="tag" data-testid="test-todo-tag-handoff">Handoff</li>
        </ul>
      </section>

      <form class="edit-form hidden" data-testid="test-todo-edit-form" aria-label="Edit task form">
        <div class="form-group">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" class="form-input" data-testid="test-todo-edit-title-input" placeholder="Task title" />
        </div>

        <div class="form-group">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" class="form-textarea" data-testid="test-todo-edit-description-input" placeholder="Task description"></textarea>
        </div>

        <div class="form-group">
          <label for="edit-priority">Priority</label>
          <select id="edit-priority" class="form-input" data-testid="test-todo-edit-priority-select">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <div class="form-group">
          <label for="edit-due-date">Due date</label>
          <input type="datetime-local" id="edit-due-date" class="form-input" data-testid="test-todo-edit-due-date-input" />
        </div>

        <div class="form-actions">
          <button type="submit" class="form-btn primary" data-testid="test-todo-save-button">Save</button>
          <button type="button" class="form-btn cancel" data-testid="test-todo-cancel-button">Cancel</button>
        </div>
      </form>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
